name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The exposure monitor is the only check that can notice a credential becoming
  # publicly retrievable again -- or still being retrievable, since the rewrite.
  # Nothing else in this workflow can see it, so it needs a clock as well as a
  # commit hook. Hourly is frequent enough to bound exposure and cheap: the
  # check makes 8 unauthenticated requests.
  schedule:
    - cron: "17 * * * *"

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the documented floor; 22 and 24 catch drift before users do.
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No lockfile is committed: the CLI has zero runtime dependencies, and
      # this working tree contains a 9Router Next.js build under .next/ whose
      # package.json would drag 590 packages into any generated lockfile.
      # See .gitignore.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Tests must not require network or credentials
        env:
          # Deliberately empty: the suite must pass with no gateway running
          # and no API key set. A test that needs either is a broken test.
          AGENTFLOW_API_KEY: ""
          AGENTFLOW_BASE_URL: "http://127.0.0.1:1"
        run: npm test

      # Guards the published working tree. This check alone is not sufficient --
      # see the `secrets-history` job below for why.
      - name: No committed credentials in working tree
        env:
          AGENTFLOW_API_KEY: ""
          AGENTFLOW_BASE_URL: "http://127.0.0.1:1"
        run: node scripts/scan-secrets.mjs

      - name: CLI runs
        env:
          AGENTFLOW_API_KEY: ""
          AGENTFLOW_BASE_URL: "http://127.0.0.1:1"
        run: |
          node bin/aflow.js --version
          node bin/aflow.js --help
          # Must fail cleanly against a dead gateway rather than throwing.
          if node bin/aflow.js --base-url http://127.0.0.1:1 doctor; then
            echo "::error::doctor exited 0 against a dead gateway"
            exit 1
          fi
          # Must report an unknown command, not silently succeed.
          if node bin/aflow.js definitely-not-a-command; then
            echo "::error::unknown command exited 0"
            exit 1
          fi

  # A working-tree scan cannot see a secret that was committed and later
  # scrubbed. That is not hypothetical: this repository published a hardcoded
  # Google API key (Windsurf registry) and an iFlow OAuth client secret, both
  # removed from HEAD within the same day, and both still reachable in history
  # -- which is why GitHub raised a public secret scanning alert against a
  # repository whose source was clean.
  #
  # fetch-depth: 0 is load-bearing. The default shallow clone has one commit, so
  # a history scan against it would silently pass while checking nothing.
  #
  # This is now blocking. It was continue-on-error only while the two known
  # findings were still in history; those objects have been rewritten out, so a
  # failure here means a credential has been reintroduced and must stop the push.
  secrets-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan every reachable blob for credentials
        run: node scripts/scan-secrets.mjs --history

  # The check that matters most, and the one that was missing.
  #
  # After the history rewrite, a fresh clone of this repository contained zero
  # occurrences of the leaked key -- and the key was still being served to
  # unauthenticated callers by the REST API from the pre-purge objects. Every
  # other job in this workflow was green while the credential was public.
  # Force-pushing rewrites refs; it does not delete objects.
  #
  # So this job asks the only question that matters: are the known-bad object ids
  # still publicly retrievable? It is expected to FAIL until the credential
  # owner rotates the values and GitHub drops the retained objects. That red
  # build is the correct signal, not a misconfiguration -- do not silence it.
  secrets-exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No token is passed to this step, and none is present in the environment:
      # the probe must be anonymous. If an unauthenticated request can read the
      # object, the exposure is real, and that is exactly what we need to know.
      - name: Are known-bad objects still publicly retrievable?
        run: node scripts/check-exposure.mjs
