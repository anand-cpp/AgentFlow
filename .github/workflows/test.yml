name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the documented floor; 22 and 24 catch drift before users do.
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No lockfile is committed: the CLI has zero runtime dependencies, and
      # this working tree contains a 9Router Next.js build under .next/ whose
      # package.json would drag 590 packages into any generated lockfile.
      # See .gitignore.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Tests must not require network or credentials
        env:
          # Deliberately empty: the suite must pass with no gateway running
          # and no API key set. A test that needs either is a broken test.
          AGENTFLOW_API_KEY: ""
          AGENTFLOW_BASE_URL: "http://127.0.0.1:1"
        run: npm test

      # Guards the published working tree. This check alone is not sufficient --
      # see the `secrets-history` job below for why.
      - name: No committed credentials in working tree
        env:
          AGENTFLOW_API_KEY: ""
          AGENTFLOW_BASE_URL: "http://127.0.0.1:1"
        run: node scripts/scan-secrets.mjs

      - name: CLI runs
        env:
          AGENTFLOW_API_KEY: ""
          AGENTFLOW_BASE_URL: "http://127.0.0.1:1"
        run: |
          node bin/aflow.js --version
          node bin/aflow.js --help
          # Must fail cleanly against a dead gateway rather than throwing.
          if node bin/aflow.js --base-url http://127.0.0.1:1 doctor; then
            echo "::error::doctor exited 0 against a dead gateway"
            exit 1
          fi
          # Must report an unknown command, not silently succeed.
          if node bin/aflow.js definitely-not-a-command; then
            echo "::error::unknown command exited 0"
            exit 1
          fi

  # A working-tree scan cannot see a secret that was committed and later
  # scrubbed. That is not hypothetical: this repository published a hardcoded
  # Google API key (Windsurf registry) and an iFlow OAuth secret, both removed
  # from HEAD within the same day, and both still reachable in history -- which
  # is why GitHub raised a public secret scanning alert against a repository
  # whose source was clean.
  #
  # fetch-depth: 0 is load-bearing. The default shallow clone has one commit, so
  # a history scan against it would silently pass while checking nothing.
  secrets-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan every reachable blob for credentials
        # Non-blocking while the two known legacy findings are still in history.
        # This becomes blocking once the history is purged; the assertion that
        # it works today lives in test/scan-secrets.test.js.
        continue-on-error: true
        run: node scripts/scan-secrets.mjs --history